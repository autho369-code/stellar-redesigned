name: Publish daily association guide

on:
  schedule:
    # GitHub delays scheduled runs that ask for the top of the hour, so these
    # sit at :23. Primary 08:23 and guarded backup 10:23 Chicago daylight time
    # (07:23 / 09:23 standard time). The marker check prevents a second
    # release when the primary ran.
    - cron: '23 13 * * *'
    - cron: '23 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scheduled-content-publish
  cancel-in-progress: false

jobs:
  trigger-production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: main

      # The run is driven by the content, not a hard-coded end date (a fixed
      # 2026-09-26 cut-off silently stopped publishing for a month). If no
      # scheduled guide carries today's Chicago date there is nothing to
      # release, so no empty marker commit and no rebuild.
      - name: Check for a guide scheduled today
        id: calendar
        shell: bash
        run: |
          today="$(TZ=America/Chicago date +%F)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || grep -q "date: '$today'" src/data/blog-posts/scheduled-*.ts; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "No guide is scheduled for $today."
          fi

      - name: Check today's publication marker
        if: steps.calendar.outputs.active == 'true'
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(cut -c1-10 .content-publish-trigger)" == "$(date -u +%F)" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Today's scheduled guide is already published."
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node.js
        if: steps.release.outputs.active == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify the scheduled release
        if: steps.release.outputs.active == 'true'
        run: |
          npm ci
          npm run seo:verify-schedule
          npm run seo:verify-silos
          npm run typecheck
          npm run build

      - name: Advance the publication marker
        if: steps.release.outputs.active == 'true'
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .content-publish-trigger
          git config user.name "stellar-content-publisher[bot]"
          git config user.email "stellar-content-publisher[bot]@users.noreply.github.com"
          git add .content-publish-trigger public/sitemap.xml
          git commit -m "chore: publish daily association guide"
          git push origin HEAD:main

      - name: Notify Bing and IndexNow participants after production updates
        if: steps.release.outputs.active == 'true'
        continue-on-error: true
        run: npm run seo:indexnow:scheduled
