name: Publish weekly association guide

on:
  schedule:
    # Tuesday morning in Chicago (09:00 CDT / 08:00 CST).
    - cron: '0 14 * * 2'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-content-publish
  cancel-in-progress: false

jobs:
  trigger-production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify the scheduled release
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Advance the weekly publication marker
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .content-publish-trigger
          git config user.name "stellar-content-publisher[bot]"
          git config user.email "stellar-content-publisher[bot]@users.noreply.github.com"
          git add .content-publish-trigger
          git commit -m "chore: publish scheduled association guide"
          git push origin HEAD:main
