name: Live site check

# Tests the public site against the growth brief: exact price wording,
# proposal blocks, robots tags, sitemap, forbidden words. Read-only.
on:
  schedule:
    - cron: '17 13 * * *' # every day, about 7:17 AM Chicago time
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for the Vercel deploy after a push
        if: github.event_name == 'push'
        run: sleep 240
      - run: node scripts/check-live-site.mjs
